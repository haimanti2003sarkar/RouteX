<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RouteX — Booking Confirmed</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="routex.css" />

    <style>
      .confirmation-page {
        max-width: 780px;
        margin: auto;
        padding: 70px 24px 100px;
      }

      .success-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .success-icon {
        width: 72px;
        height: 72px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 20px;

        border-radius: 50%;

        background: #dcfce7;
        color: #16a34a;

        font-size: 32px;
        font-weight: 800;
      }

      .success-header h1 {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 38px;
        letter-spacing: -1.5px;
      }

      .success-header p {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .ticket {
        overflow: hidden;

        background: var(--surface);

        border: 1px solid var(--border);
        border-radius: 20px;

        box-shadow: 0 25px 60px rgba(16, 24, 40, 0.08);
      }

      .ticket-top {
        padding: 28px;

        border-bottom: 1px dashed var(--border);
      }

      .ticket-brand {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 28px;
      }

      .ticket-brand span {
        color: var(--muted);
        font-size: 11px;
      }

      .booking-id {
        color: var(--primary);
        font-weight: 800;
      }

      .route-display {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;

        text-align: center;
      }

      .route-city {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 25px;
        font-weight: 800;
      }

      .route-city small {
        display: block;

        margin-top: 3px;

        color: var(--muted);
        font-family: "Inter", sans-serif;
        font-size: 11px;
        font-weight: 500;
      }

      .route-arrow-large {
        padding: 0 30px;

        color: var(--primary);

        font-size: 25px;
      }

      .ticket-details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

        gap: 1px;

        background: var(--border);
      }

      .ticket-detail {
        padding: 20px;

        background: var(--surface);
      }

      .ticket-detail span {
        display: block;

        margin-bottom: 5px;

        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.7px;
      }

      .ticket-detail strong {
        font-size: 13px;
      }

      .ticket-total {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 20px 28px;

        background: var(--soft-blue);
      }

      .ticket-total span {
        color: var(--muted);
        font-size: 12px;
      }

      .ticket-total strong {
        color: var(--primary);
        font-size: 22px;
      }

      .ticket-actions {
        display: flex;
        justify-content: center;
        gap: 12px;

        margin-top: 25px;
      }

      .action-button {
        padding: 12px 20px;

        border-radius: 10px;

        font-size: 13px;
        font-weight: 700;

        cursor: pointer;
      }

      .primary-action {
        border: none;

        background: var(--primary);
        color: white;
      }

      .secondary-action {
        border: 1px solid var(--border);

        background: var(--surface);
        color: var(--dark);
      }

      .confirmation-loading {
        padding: 100px 20px;

        text-align: center;

        color: var(--muted);
      }

      /* dark mode */

      body.dark-theme .success-icon {
        background: #12351f;
        color: #4ade80;
      }

      /* Print */

      @media print {
        .navbar,
        .ticket-actions {
          display: none !important;
        }

        body {
          background: white;
        }

        .confirmation-page {
          padding: 20px;
        }

        .ticket {
          box-shadow: none;
        }
      }

      @media (max-width: 600px) {
        .confirmation-page {
          padding-top: 45px;
        }

        .success-header h1 {
          font-size: 30px;
        }

        .route-city {
          font-size: 19px;
        }

        .route-arrow-large {
          padding: 0 12px;
        }

        .ticket-details {
          grid-template-columns: 1fr 1fr;
        }

        .ticket-actions {
          flex-direction: column;
        }

        .action-button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->

    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <span class="logo-icon">✦</span>
          Route<span>X</span>
        </a>

        <div class="nav-actions">
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle dark mode"
          >
            <span id="themeIcon">☾</span>
          </button>

          <button
            class="nav-button"
            onclick="window.location.href = 'index.html'"
          >
            Home
          </button>
        </div>
      </div>
    </header>

    <main class="confirmation-page">
      <!-- SUCCESS HEADER -->

      <div class="success-header">
        <div class="success-icon">✓</div>

        <h1>Booking confirmed!</h1>

        <p>Your journey has been successfully reserved.</p>
      </div>

      <!-- Loading -->

      <div id="confirmationLoading" class="ticket confirmation-loading">
        Preparing your ticket...
      </div>

      <!-- TICKET -->

      <div id="ticket" class="ticket" style="display: none">
        <div class="ticket-top">
          <div class="ticket-brand">
            <strong class="logo">
              Route<span style="color: var(--primary)">X</span>
            </strong>

            <span>
              BOOKING ID:
              <strong id="bookingId" class="booking-id"> — </strong>
            </span>
          </div>

          <div class="route-display">
            <div>
              <div id="ticketSource" class="route-city">—</div>

              <small> Departure </small>
            </div>

            <div class="route-arrow-large">→</div>

            <div>
              <div id="ticketDestination" class="route-city">—</div>

              <small> Destination </small>
            </div>
          </div>
        </div>

        <div class="ticket-details">
          <div class="ticket-detail">
            <span>PASSENGER</span>

            <strong id="ticketPassenger"> — </strong>
          </div>

          <div class="ticket-detail">
            <span>BUS</span>

            <strong id="ticketBus"> — </strong>
          </div>

          <div class="ticket-detail">
            <span>DATE</span>

            <strong id="ticketDate"> — </strong>
          </div>

          <div class="ticket-detail">
            <span>DEPARTURE</span>

            <strong id="ticketTime"> — </strong>
          </div>

          <div class="ticket-detail">
            <span>SEATS</span>

            <strong id="ticketSeats"> — </strong>
          </div>

          <div class="ticket-detail">
            <span>EMAIL</span>

            <strong id="ticketEmail"> — </strong>
          </div>
        </div>

        <div class="ticket-total">
          <span> Total amount </span>

          <strong> ₹<span id="ticketTotal">0</span> </strong>
        </div>
      </div>

      <div
        id="confirmationActions"
        class="ticket-actions"
        style="display: none"
      >
        <button class="action-button primary-action" onclick="window.print()">
          Print ticket
        </button>

        <button
          class="action-button secondary-action"
          onclick="window.location.href = 'index.html'"
        >
          Book another journey
        </button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="confirmation.js"></script>
  </body>
</html>
